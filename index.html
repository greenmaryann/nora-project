<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%0A%3Cpath%20d%3D%22M45.5986%203.5498C47.2448%201.9251%2051.9504%204.02357%2056.1094%208.2373C60.2684%2012.4511%2062.3053%2017.1848%2060.6592%2018.8096C59.8236%2019.6338%2058.2008%2019.4975%2056.2608%2018.6143C60.2926%2024.4164%2061.7407%2029.8315%2059.4424%2032.1006C57.6519%2033.8678%2053.9834%2033.335%2049.7315%2031.0732C58.3808%2042.5359%2061.8673%2053.4488%2057.5264%2057.7334C53.1202%2062.0823%2041.9911%2058.2782%2030.459%2049.1904C33.1321%2053.9066%2033.8478%2058.0387%2031.9151%2059.9463C29.6582%2062.1729%2024.4187%2060.7488%2018.7891%2056.8105C19.345%2058.4034%2019.329%2059.7054%2018.6104%2060.415C16.9642%2062.0398%2012.2577%2059.9414%208.09865%2055.7275C3.93974%2051.5137%201.90272%2046.78%203.54885%2045.1553C4.27734%2044.4364%205.60544%2044.4469%207.21974%2045.0469C3.42673%2039.4185%202.11219%2034.2269%204.3506%2032.0176C6.25468%2030.1383%2010.2824%2030.8587%2014.877%2033.4951C5.70741%2021.6955%201.90942%2010.3011%206.36818%205.90039C10.6944%201.63105%2021.5001%205.22068%2032.8057%2013.9531C30.5746%209.64756%2030.0785%205.94694%2031.877%204.17187C34.2212%201.8587%2039.7849%203.48438%2045.6602%207.77637C44.8713%205.90241%2044.7882%204.34974%2045.5986%203.5498Z%22%20fill%3D%22%231F1F1F%22/%3E%0A%3C/svg%3E">
<title>Nora — Espacio de producto</title>
<style>
  :root{
    --dark:#1F1F1F;--mid:#5E5E5E;--gray:#8C8C8C;--light:#B3B3B3;
    --bg:#FAFAFA;--white:#FFFFFF;--border:#E4E4E4;--grayL:#F1F1F1;--grayLL:#F7F7F7;
    --sidebar-w:264px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--dark);-webkit-font-smoothing:antialiased;display:flex;}

  /* SIDEBAR */
  .sidebar{width:var(--sidebar-w);flex:none;height:100vh;position:sticky;top:0;background:var(--white);border-right:1px solid var(--border);padding:26px 18px;display:flex;flex-direction:column;overflow-y:auto;}
  .brand{padding:0 8px 22px;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .brand h1{font-size:16px;font-weight:600;letter-spacing:-0.3px;}
  .brand p{font-size:11.5px;color:var(--gray);margin-top:3px;}

  .nav-group{margin-bottom:22px;}
  .nav-group-label{font-size:10px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:var(--light);padding:0 8px;margin-bottom:8px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--mid);cursor:pointer;text-decoration:none;transition:all .12s;margin-bottom:2px;}
  .nav-item:hover{background:var(--grayLL);color:var(--dark);}
  .nav-item.active{background:var(--dark);color:var(--white);}
  .nav-item .ico{width:16px;height:16px;flex:none;opacity:.85;}
  .nav-item.active .ico{opacity:1;}
  .nav-item .dot{margin-left:auto;width:5px;height:5px;border-radius:50%;background:var(--light);flex:none;}
  .nav-item.active .dot{background:rgba(255,255,255,.55);}

  .sidebar-foot{margin-top:auto;padding:16px 8px 4px;border-top:1px solid var(--border);font-size:10.5px;color:var(--light);line-height:1.5;}

  /* CONTENT */
  .content{flex:1;height:100vh;overflow:hidden;position:relative;}
  .frame{width:100%;height:100%;border:0;display:block;background:var(--bg);}
  .frame.hidden{display:none;}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--light);font-size:13px;background:var(--bg);pointer-events:none;opacity:0;transition:opacity .15s;}
  .loading.show{opacity:1;}

  /* EMPTY / WIP */
  .wip{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:40px;background:var(--bg);overflow-y:auto;}
  .wip.show{display:flex;}
  .wip-box{max-width:440px;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:30px 32px;}
  .wip-label{font-size:10px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:var(--light);margin-bottom:10px;}
  .wip-box h2{font-size:19px;font-weight:600;letter-spacing:-0.3px;margin-bottom:10px;}
  .wip-box p{font-size:13px;color:var(--mid);line-height:1.65;font-weight:300;}
  .wip-file{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--light);}
  .wip-file code{color:var(--gray);}

  /* MOBILE */
  .menu-btn{display:none;position:fixed;top:14px;left:14px;z-index:30;background:var(--white);border:1px solid var(--border);border-radius:9px;width:40px;height:40px;cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:4px;}
  .menu-btn span{display:block;width:17px;height:1.5px;background:var(--dark);}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:19;}

  @media(max-width:820px){
    .sidebar{position:fixed;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 20px rgba(0,0,0,.08);}
    body.nav-open .sidebar{transform:translateX(0);}
    body.nav-open .overlay{display:block;}
    .menu-btn{display:flex;}
    .content{width:100%;}
    .brand{padding-top:8px;}
  }
</style>
</head>
<body>

<button class="menu-btn" onclick="document.body.classList.toggle('nav-open')" aria-label="Menú">
  <span></span><span></span><span></span>
</button>
<div class="overlay" onclick="document.body.classList.remove('nav-open')"></div>

<aside class="sidebar">
  <div class="brand">
    <h1>Espacio de producto</h1>
    <p>Nora · Mujer Financiera</p>
  </div>

  <nav>
    <div class="nav-group">
      <div class="nav-group-label">Scope</div>
      <a class="nav-item" data-section="scope-sep" href="#scope-sep">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Septiembre
      </a>
      <a class="nav-item" data-section="scope-ago" href="#scope-ago">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Agosto
      </a>
      <a class="nav-item" data-section="scope-jul" href="#scope-jul">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Julio
      </a>
    </div>

    <div class="nav-group">
      <div class="nav-group-label">Producto</div>
      <a class="nav-item" data-section="map" href="#map">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
        Product Map
      </a>
      <a class="nav-item" data-section="flows" href="#flows">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3v4M3 5h4M6 17v4M4 19h4"/><path d="M13 3l3.5 8.5L21 13l-8.5 3.5L11 21l-3.5-8.5L3 11z"/></svg>
        Flujos
      </a>
      <a class="nav-item" data-section="onboarding" href="#onboarding">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Onboarding
      </a>
      <a class="nav-item" data-section="branding" href="#branding">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/></svg>
        Branding
      </a>
      <a class="nav-item" data-section="ds" href="#ds">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Design System
      </a>
    </div>

    <div class="nav-group">
      <div class="nav-group-label">Archivo</div>
      <a class="nav-item" data-section="planning" href="#planning">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Planificación
      </a>
      <a class="nav-item" data-section="feedback" href="#feedback">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 8h2a2 2 0 0 1 2 2v9l-3.5-3H9a2 2 0 0 1-2-2v-1"/><path d="M3 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H6l-3 3z"/></svg>
        Feedback
      </a>
    </div>
  </nav>

  <div class="sidebar-foot">
    Mary Ann Villalobos + Enoc Montiel
  </div>
</aside>

<main class="content">
  <div class="loading" id="loading">Cargando…</div>
  <div class="wip" id="wip">
    <div class="wip-box">
      <div class="wip-label">En construcción</div>
      <h2 id="wip-title"></h2>
      <p id="wip-body"></p>
      <div class="wip-file">Archivo pendiente: <code id="wip-file"></code></div>
    </div>
  </div>
  <iframe class="frame" id="frame" title="Contenido"></iframe>
</main>

<script>
  const sections = {
    'scope-sep':  {file:'scope-septiembre.html', title:'Scope Septiembre', wip:'Mes 3 de construcción. Lo armamos con el detalle que definamos con Enoc.'},
    'scope-ago':  {file:'scope-agosto.html',     title:'Scope Agosto',     wip:'Mes 2 de construcción. Pendiente de documentar en retrospectiva.'},
    'scope-jul':  {file:'scope.html',            title:'Scope Julio'},
    'map':        {file:'map.html',              title:'Product Map'},
    'flows':      {file:'docs.html',             title:'Flujos'},
    'onboarding': {file:'onboarding.html',       title:'Onboarding'},
    'branding':   {file:'branding.html',         title:'Branding',      wip:'Color, tipografías, personaje, lockups y tono de voz. En borrador.'},
    'ds':         {file:'design-system.html',    title:'Design System', wip:'Tokens, tipografía, grillas, iconografía y estado de componentes. En borrador.'},
    'planning':   {file:'planning.html',         title:'Planificación'},
    'feedback':   {file:'feedback.html',         title:'Feedback',      wip:'Feedback de la comunidad MF sobre el PFM anterior. Hoy vive adentro de Flujos; se separa acá.'}
  };
  const DEFAULT = 'scope-sep';

  const frame   = document.getElementById('frame');
  const loading = document.getElementById('loading');
  const wip     = document.getElementById('wip');

  function go(section, push){
    if(!sections[section]) section = DEFAULT;
    const s = sections[section];

    document.querySelectorAll('.nav-item').forEach(n =>
      n.classList.toggle('active', n.dataset.section === section));

    if(s.wip){
      frame.classList.add('hidden');
      frame.removeAttribute('src');
      loading.classList.remove('show');
      document.getElementById('wip-title').textContent = s.title;
      document.getElementById('wip-body').textContent  = s.wip;
      document.getElementById('wip-file').textContent  = s.file;
      wip.classList.add('show');
    } else {
      wip.classList.remove('show');
      frame.classList.remove('hidden');
      loading.classList.add('show');
      frame.src = s.file;
    }

    if(push && location.hash.slice(1) !== section){
      try { history.replaceState(null, '', '#' + section); }
      catch(e){ /* sandboxed preview blocks replaceState — ignore */ }
    }

    document.body.classList.remove('nav-open');
    document.title = 'Nora — ' + s.title;
  }

  frame.addEventListener('load', () => loading.classList.remove('show'));

  document.querySelectorAll('.nav-item').forEach(n =>
    n.addEventListener('click', e => { e.preventDefault(); go(n.dataset.section, true); }));

  window.addEventListener('hashchange', () => go(location.hash.slice(1), false));

  go(location.hash.slice(1) || DEFAULT, true);
</script>
</body>
</html>

<title>Nora — Espacio de producto</title>
<style>
  :root{
    --dark:#1E3238;--mid:#5E6B6E;--gray:#8C9598;--light:#B3B9BA;
    --bg:#FAFAFA;--white:#FFFFFF;--border:#E4E4E4;--grayL:#F1F1F1;--grayLL:#F7F7F7;
    --sidebar-w:264px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--dark);-webkit-font-smoothing:antialiased;display:flex;}

  /* SIDEBAR */
  .sidebar{width:var(--sidebar-w);flex:none;height:100vh;position:sticky;top:0;background:var(--white);border-right:1px solid var(--border);padding:26px 18px;display:flex;flex-direction:column;overflow-y:auto;}
  .brand{padding:0 8px 22px;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .brand .logo{display:block;width:96px;height:auto;margin-bottom:14px;}
  .brand h1{font-size:14px;font-weight:600;letter-spacing:-0.2px;}
  .brand p{font-size:11.5px;color:var(--gray);margin-top:3px;}

  .nav-group{margin-bottom:22px;}
  .nav-group-label{font-size:10px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:var(--light);padding:0 8px;margin-bottom:8px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--mid);cursor:pointer;text-decoration:none;transition:all .12s;margin-bottom:2px;}
  .nav-item:hover{background:var(--grayLL);color:var(--dark);}
  .nav-item.active{background:var(--dark);color:var(--white);}
  .nav-item .ico{width:16px;height:16px;flex:none;opacity:.85;}
  .nav-item.active .ico{opacity:1;}

  /* collapsible group */
  .nav-group.archive{margin-top:auto;padding-top:20px;border-top:1px solid var(--border);}
  .nav-toggle{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;cursor:pointer;font-family:inherit;font-size:10px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:var(--light);padding:0 8px;margin-bottom:8px;}
  .nav-toggle:hover{color:var(--gray);}
  .nav-toggle .chev{margin-left:auto;font-size:9px;transition:transform .15s;}
  .nav-group.archive.open .nav-toggle .chev{transform:rotate(180deg);}
  .archive-body{display:none;}
  .nav-group.archive.open .archive-body{display:block;}

  .sidebar-foot{padding:16px 8px 4px;border-top:1px solid var(--border);margin-top:20px;font-size:10.5px;color:var(--light);line-height:1.5;}

  /* CONTENT */
  .content{flex:1;height:100vh;overflow:hidden;position:relative;}
  .frame{width:100%;height:100%;border:0;display:block;background:var(--bg);}
  .frame.hidden{display:none;}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--light);font-size:13px;background:var(--bg);pointer-events:none;opacity:0;transition:opacity .15s;}
  .loading.show{opacity:1;}

  /* WIP */
  .wip{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:40px;background:var(--bg);overflow-y:auto;}
  .wip.show{display:flex;}
  .wip-box{max-width:440px;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:30px 32px;}
  .wip-label{font-size:10px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:var(--light);margin-bottom:10px;}
  .wip-box h2{font-size:19px;font-weight:600;letter-spacing:-0.3px;margin-bottom:10px;}
  .wip-box p{font-size:13px;color:var(--mid);line-height:1.65;font-weight:300;}
  .wip-file{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--light);}
  .wip-file code{color:var(--gray);}

  /* MOBILE */
  .menu-btn{display:none;position:fixed;top:14px;left:14px;z-index:30;background:var(--white);border:1px solid var(--border);border-radius:9px;width:40px;height:40px;cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:4px;}
  .menu-btn span{display:block;width:17px;height:1.5px;background:var(--dark);}
  .overlay{display:none;position:fixed;inset:0;background:rgba(30,50,56,.3);z-index:19;}

  @media(max-width:820px){
    .sidebar{position:fixed;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 20px rgba(30,50,56,.08);}
    body.nav-open .sidebar{transform:translateX(0);}
    body.nav-open .overlay{display:block;}
    .menu-btn{display:flex;}
    .content{width:100%;}
    .brand{padding-top:8px;}
  }
</style>
</head>

<script>
  const sections = {
    'map':        {file:'map.html',           title:'Product Map',   group:'producto'},
    'onboarding': {file:'onboarding.html',    title:'Onboarding',    group:'producto'},
    'branding':   {file:'branding.html',      title:'Branding',      group:'producto'},
    'ds':         {file:'design-system.html', title:'Design System', group:'producto'},
    'flows':      {file:'docs.html',          title:'Flujos',        group:'archive'},
    'planning':   {file:'planning.html',      title:'Planificación', group:'archive'},
    'feedback':   {file:'feedback.html',      title:'Feedback',      group:'archive'}
  };
  const DEFAULT = 'map';

  const frame   = document.getElementById('frame');
  const loading = document.getElementById('loading');
  const wip     = document.getElementById('wip');
  const archive = document.getElementById('archive-group');

  function go(section, push){
    if(!sections[section]) section = DEFAULT;
    const s = sections[section];

    document.querySelectorAll('.nav-item').forEach(n =>
      n.classList.toggle('active', n.dataset.section === section));

    if(s.group === 'archive') archive.classList.add('open');

    if(s.wip){
      frame.classList.add('hidden');
      frame.removeAttribute('src');
      loading.classList.remove('show');
      document.getElementById('wip-title').textContent = s.title;
      document.getElementById('wip-body').textContent  = s.wip;
      document.getElementById('wip-file').textContent  = s.file;
      wip.classList.add('show');
    } else {
      wip.classList.remove('show');
      frame.classList.remove('hidden');
      loading.classList.add('show');
      frame.src = s.file;
    }

    if(push && location.hash.slice(1) !== section){
      try { history.replaceState(null, '', '#' + section); }
      catch(e){ /* sandboxed preview blocks replaceState — ignore */ }
    }

    document.body.classList.remove('nav-open');
    document.title = 'Nora — ' + s.title;
  }

  frame.addEventListener('load', () => loading.classList.remove('show'));

  document.querySelectorAll('.nav-item').forEach(n =>
    n.addEventListener('click', e => { e.preventDefault(); go(n.dataset.section, true); }));

  window.addEventListener('hashchange', () => go(location.hash.slice(1), false));

  go(location.hash.slice(1) || DEFAULT, true);
</script>
